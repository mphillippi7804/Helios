name: HeliosDev Build & Create MSI Files
# This workflow is intended to produce a new Helios build for testing (ie 1.6.1000.0). 
# On successful build and packaging, the files are made available as assets
# 
# This workflow requires strict adherence to the Helios Tag and Branch naming
# conventions.

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# needed to publish the installers as a GitHub Release
permissions:
  contents: write
  
jobs:  
  build:    
    runs-on: windows-latest
   
    steps:      
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Stage clean source for the download package
        # copy every tracked file (including submodules) before the build creates or changes anything
        shell: cmd
        run: |
          git -c core.quotepath=off ls-files --recurse-submodules > "%RUNNER_TEMP%\source-files.txt"
          tar -c -f "%RUNNER_TEMP%\source.tar" -T "%RUNNER_TEMP%\source-files.txt"
          mkdir "%RUNNER_TEMP%\package\Helios-Developer-Edition"
          tar -x -f "%RUNNER_TEMP%\source.tar" -C "%RUNNER_TEMP%\package\Helios-Developer-Edition"

      - name: Choose version number
        # every build gets the next number (1.6.1001.0, 1.6.1002.0, ...) so a new installer replaces the previous one;
        # it stays in the 1.6.1xxx.x range that the installer scripts treat as a development build
        shell: pwsh
        run: |
          $build = 1000 + ${{ github.run_number }}
          if ($build -gt 1999) { throw "Developer Edition version numbers are exhausted; change the numbering in DevBuild.yml." }
          $version = "1.6.$build.0"
          echo "DEV_VERSION=$version" >> $env:GITHUB_ENV
          echo "Building Helios Developer Edition $version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        
      - name: Navigate to Workspace
        run: cd $GITHUB_WORKSPACE

      - name: Disable Out of Process Building
        run: .\DisableOutOfProcBuild.exe
        working-directory: C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\IDE\CommonExtensions\Microsoft\VSI\DisableOutOfProcBuild

      - uses: nuget/setup-nuget@v1
        with:
          nuget-api-key: ${{ secrets.NuGetAPIKey }}
          nuget-version: '5.x'
          
      - name: NuGet Restore
        run: |
          nuget restore BuildMeFirst.sln
          nuget restore "KeyPressReceiver/Keypress Receiver.csproj"
          nuget restore Thirdparty/StreamDeckSharp/src/StreamDeckSharp/StreamDeckSharp.csproj
          nuget restore Thirdparty/OpenMacroBoard.SDK/src/OpenMacroBoard.SDK/OpenMacroBoard.SDK.csproj
          nuget restore Thirdparty/OpenMacroBoard.SDK/src/OpenMacroBoard.VirtualBoard/OpenMacroBoard.VirtualBoard.csproj
          nuget restore Helios.sln
        
      - name: Clean and Build x86 and x64 Solutions
        continue-on-error: true
        shell: cmd
        run: |
          build.cmd dev %DEV_VERSION%
          echo "rc=%errorlevel%" >> $env:GITHUB_ENV

      - name: zip up build logs
        continue-on-error: true
        run: |
          mkdir ./Assets
          tar -a -c -f "BuildLogs.zip" -C "." *.binlog

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: Build Logs
          path: "./BuildLogs.zip"
          retention-days: 5

      - name: Force Error if there was a Previous Error
        # This is a delayed exit because we needed to make the build logs available before leaving
        if: ${{ env.rc != 0 }}
        run: |
          ForceExit   #  This should always cause an error because the program will not be found.  The real error is going to be on the Clean & Build step above.

      - name: zip up the msi
        continue-on-error: true
        run: |
          tar -a -c -f "./Assets/HeliosDev_Installers.zip" -C "Helios Installer\Release" *.msi -C "../../Keypress Receiver Installer/Release" *.msi -C "../../Tools Installer/Release" *.msi
          tar -a -c -f "./Assets/HeliosDev32Bit_Installers.zip" -C "Helios Installer/Release32" *.msi
          tar -a -c -f "./Assets/HeliosDev_StreamDeck_Alpha.zip" -C "bin/x64/Release" Plugins/OpenMacroBoard.SDK.dll Plugins/OpenMacroBoard.VirtualBoard.dll Plugins/StreamDeckSharp.dll Plugins/HeliosMacroBoard.dll
    
      - name: Publish installers as a GitHub Release
        # each build becomes a Release on the repository's main page with:
        #   - the 64-bit and 32-bit Developer Edition installers
        #   - one zip with the full source and an Installers folder holding both installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $msi64 = Get-ChildItem "Helios Installer/Release/Helios.*.msi" | Select-Object -First 1
          $msi32 = Get-ChildItem "Helios Installer/Release32/Helios32bit.*.msi" | Select-Object -First 1
          if (-not $msi64 -or -not $msi32) { throw "Installers were not built, nothing to publish." }

          $out = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $msi64.FullName (Join-Path $out "Helios-Developer-Edition-64bit.msi")
          Copy-Item $msi32.FullName (Join-Path $out "Helios-Developer-Edition-32bit.msi")

          $pkg = Join-Path $env:RUNNER_TEMP "package/Helios-Developer-Edition"
          $inst = Join-Path $pkg "Installers"
          New-Item -ItemType Directory -Force -Path $inst | Out-Null
          Copy-Item (Join-Path $out "Helios-Developer-Edition-64bit.msi") $inst
          Copy-Item (Join-Path $out "Helios-Developer-Edition-32bit.msi") $inst
          tar -a -c -f (Join-Path $out "Helios-Developer-Edition-source-and-installers.zip") -C (Join-Path $env:RUNNER_TEMP "package") "Helios-Developer-Edition"

          $tag = "developer-edition-$env:DEV_VERSION"
          $notes = "Helios Developer Edition $env:DEV_VERSION built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.`n`n" +
                   "- Helios-Developer-Edition-64bit.msi: installer for 64-bit Windows (most PCs)`n" +
                   "- Helios-Developer-Edition-32bit.msi: installer for 32-bit Windows`n" +
                   "- Helios-Developer-Edition-source-and-installers.zip: full source code with both installers in its Installers folder`n`n" +
                   "Installs to Program Files\Helios Development alongside regular Helios and adds a Developer Edition shortcut to the desktop." + "`n`n" +
                   "Free software under the GNU General Public License v3 (see LICENSE.txt and NOTICE.txt). Modified version of Helios Virtual Cockpit; not an official Helios release."
          gh release create $tag `
            (Join-Path $out "Helios-Developer-Edition-64bit.msi") `
            (Join-Path $out "Helios-Developer-Edition-32bit.msi") `
            (Join-Path $out "Helios-Developer-Edition-source-and-installers.zip") `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "Helios Developer Edition $env:DEV_VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }

      - name: Upload Helios_Installers 1
        uses: actions/upload-artifact@v4
        with:
          name: Helios ${{ env.NewTag }} Release Candidate 64Bit Installers
          path: "./Assets/HeliosDev_Installers.zip"
          retention-days: 2
          
      - name: Upload Helios_Installers 2
        uses: actions/upload-artifact@v4
        with:
          name: Helios ${{ env.NewTag }} Release Candidate 32Bit Installers
          path: "./Assets/HeliosDev32Bit_Installers.zip"
          retention-days: 2
          
      - name: Upload Helios_Installers 3
        uses: actions/upload-artifact@v4
        with:
          name: Helios ${{ env.NewTag }} Release Candidate Stream Deck Installer
          path: "./Assets/HeliosDev_StreamDeck_Alpha.zip"
          retention-days: 2   
