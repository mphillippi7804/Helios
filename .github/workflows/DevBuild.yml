name: Helios Build (Profile Editor improvements) & Publish Release
# Builds this branch on GitHub and publishes the result as a Release:
#   - version = the official Helios version this source is based on, plus ".5" (e.g. 1.6.6200.7.5),
#     worked out automatically by EditionVersion.ps1
#   - 64-bit and 32-bit installers, plus a zip of the full source with both installers in it
# The installers use the normal Helios folders and replace an installed Helios with the same
# first three version numbers.

on:
  # run manually from the Actions tab
  workflow_dispatch:

# needed to publish the installers as a GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0

      - name: Stage clean source for the download package
        # copy every tracked file (including submodules) before the build creates or changes anything
        shell: cmd
        run: |
          git -c core.quotepath=off ls-files --recurse-submodules > "%RUNNER_TEMP%\source-files.txt"
          tar -c -f "%RUNNER_TEMP%\source.tar" -T "%RUNNER_TEMP%\source-files.txt"
          mkdir "%RUNNER_TEMP%\package\Helios"
          tar -x -f "%RUNNER_TEMP%\source.tar" -C "%RUNNER_TEMP%\package\Helios"

      - name: Choose version number
        # official Helios version this source is based on, plus ".5"; see EditionVersion.ps1
        shell: pwsh
        run: |
          $line = & ./EditionVersion.ps1
          $parts = "$line".Trim().Split(' ')
          if ($parts.Count -ne 2) { throw "Could not determine the version (got '$line')." }
          echo "HELIOS_VERSION=$($parts[1])" >> $env:GITHUB_ENV
          echo "Building Helios $($parts[1]) (program version $($parts[0]))"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Disable Out of Process Building
        run: .\DisableOutOfProcBuild.exe
        working-directory: C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\IDE\CommonExtensions\Microsoft\VSI\DisableOutOfProcBuild

      - uses: nuget/setup-nuget@v1
        with:
          nuget-version: '5.x'

      - name: NuGet Restore
        run: |
          nuget restore BuildMeFirst.sln
          nuget restore "KeyPressReceiver/Keypress Receiver.csproj"
          nuget restore Thirdparty/StreamDeckSharp/src/StreamDeckSharp/StreamDeckSharp.csproj
          nuget restore Thirdparty/OpenMacroBoard.SDK/src/OpenMacroBoard.SDK/OpenMacroBoard.SDK.csproj
          nuget restore Thirdparty/OpenMacroBoard.SDK/src/OpenMacroBoard.VirtualBoard/OpenMacroBoard.VirtualBoard.csproj
          nuget restore Helios.sln

      - name: Build solutions and installers
        shell: cmd
        run: build.cmd auto

      - name: Upload build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Build Logs
          path: "*.binlog"
          retention-days: 5

      - name: Publish installers as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = $env:HELIOS_VERSION
          $msi64 = Get-Item "Helios Installer/Release/Helios.$v.msi" -ErrorAction SilentlyContinue
          $msi32 = Get-Item "Helios Installer/Release32/Helios32bit.$v.msi" -ErrorAction SilentlyContinue
          if (-not $msi64 -or -not $msi32) { throw "Installers for $v were not built, nothing to publish." }

          $out = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $name64 = "Helios.$v.64bit.msi"
          $name32 = "Helios.$v.32bit.msi"
          $nameZip = "Helios.$v.source-and-installers.zip"
          Copy-Item $msi64.FullName (Join-Path $out $name64)
          Copy-Item $msi32.FullName (Join-Path $out $name32)

          $inst = Join-Path $env:RUNNER_TEMP "package/Helios/Installers"
          New-Item -ItemType Directory -Force -Path $inst | Out-Null
          Copy-Item (Join-Path $out $name64) $inst
          Copy-Item (Join-Path $out $name32) $inst
          tar -a -c -f (Join-Path $out $nameZip) -C (Join-Path $env:RUNNER_TEMP "package") "Helios"

          $tag = "helios-$v"
          # rebuilding the same version replaces its earlier release
          gh release delete $tag --repo "${{ github.repository }}" --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0

          $notes = "Helios Dev Custom $v (official Helios with Profile Editor improvements), built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.`n`n" +
                   "- $($name64): installer for 64-bit Windows (most PCs)`n" +
                   "- $($name32): installer for 32-bit Windows`n" +
                   "- $($nameZip): full source code with both installers in its Installers folder`n`n" +
                   "Installs as Helios Dev Custom in Program Files\Helios Virtual Cockpit\Helios Dev Custom, alongside regular Helios, which cannot overwrite or remove it." + "`n`n" +
                   "Free software under the GNU General Public License v3 (see LICENSE.txt and NOTICE.txt). Modified version of Helios Virtual Cockpit; not an official Helios release."
          gh release create $tag (Join-Path $out $name64) (Join-Path $out $name32) (Join-Path $out $nameZip) `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "Helios Dev Custom $v" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
